<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAWARC Architects — Architecture &amp; Interior Design</title>
  <meta name="description" content="JAWARC Architects — architecture and interior design for residential and commercial projects. Selected work, drawings, visualisations and film.">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JAWARC Architects">
  <meta property="og:title" content="JAWARC Architects — Architecture &amp; Interior Design">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Marks that JS is running, so reveal states only hide content when they can be revealed. -->
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main" data-skip class="eyebrow fixed left-4 top-4 z-[120] -translate-y-24 rounded-sm bg-fg px-4 py-3 text-ink focus:translate-y-0">Skip to content</a>

  <div id="header-mount"></div>
  <main id="main" tabindex="-1" class="outline-none"><div id="view" class="page-enter"></div></main>
  <div id="footer-mount"></div>

  <!-- Lightbox -->
  <div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image gallery" class="lightbox theme-dark fixed inset-0 z-[80] flex flex-col bg-ink text-fg">
    <div class="flex items-center justify-between px-[var(--gutter)] py-5">
      <p class="eyebrow text-fg-2" aria-live="polite" data-lb-count></p>
      <button type="button" data-lb-close class="eyebrow flex items-center gap-3 py-2 text-fg">
        Close
        <span aria-hidden="true" class="relative block h-3.5 w-3.5">
          <span class="absolute left-0 top-1/2 h-px w-full rotate-45 bg-current"></span>
          <span class="absolute left-0 top-1/2 h-px w-full -rotate-45 bg-current"></span>
        </span>
      </button>
    </div>
    <div data-lb-area class="relative flex min-h-0 flex-1 items-center justify-center px-[var(--gutter)]" style="touch-action:pan-y">
      <div data-lb-stage class="lb-stage relative"></div>
      <button type="button" data-lb-step="-1" aria-label="Previous image" class="absolute left-[var(--gutter)] top-1/2 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full border border-hair text-fg transition-colors hover:bg-fg hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" class="rotate-180"><path d="M2 9h13M10 4l5 5-5 5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" data-lb-step="1" aria-label="Next image" class="absolute right-[var(--gutter)] top-1/2 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full border border-hair text-fg transition-colors hover:bg-fg hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 9h13M10 4l5 5-5 5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
    <div class="min-h-[5.5rem] px-[var(--gutter)] py-5"><p class="meta max-w-2xl text-fg-2" data-lb-caption></p></div>
  </div>

  <!-- Page transition curtain -->
  <div id="curtain" aria-hidden="true" class="curtain" data-phase="idle"></div>

  <noscript><p style="padding:2rem;color:#f5f5f5;font-family:sans-serif">Please enable JavaScript to view this site.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
